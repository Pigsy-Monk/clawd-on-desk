<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* ===== Body: a slow breath while Clawd holds the sign up ===== */
      .breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }
      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: shadow-breathe 3.2s infinite ease-in-out;
      }

      /* ===== The sign rises into view, a single time ===== */
      .sign-rise {
        animation: sign-rise 0.32s ease-out both;
      }

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }
      @keyframes shadow-breathe {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        50% { transform: scaleX(1.03); opacity: 0.55; }
      }
      @keyframes sign-rise {
        from { transform: translate(0, 3px); opacity: 0; }
        to { transform: translate(0, 0); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        .breathe, .shadow-anim, .sign-rise { animation: none; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000" opacity="0.5"/>

  <!-- Body. The renderer shows one arm pose at a time: the right arm raised
       while the right hand holds the stick, the left one after a toss. -->
  <g id="accessory-anchor" class="breathe">
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
    </g>
    <g id="notice-arms-right" fill="#DE886D">
      <rect x="0" y="7" width="2" height="2"/>
      <rect x="13" y="4" width="2" height="4"/>
    </g>
    <g id="notice-arms-left" fill="#DE886D" visibility="hidden">
      <rect x="0" y="4" width="2" height="4"/>
      <rect x="13" y="7" width="2" height="2"/>
    </g>
    <g id="eyes-up">
      <rect x="4" y="7" width="1" height="2" fill="#000"/>
      <rect x="10" y="7" width="1" height="2" fill="#000"/>
      <rect x="4" y="7" width="1" height="0.6" fill="#5A3022"/>
      <rect x="10" y="7" width="1" height="0.6" fill="#5A3022"/>
    </g>
  </g>

  <!-- The sign: a stick and a chalkboard. Drawn after the body so the zoomed
       board stays on top. The renderer moves #notice-sign-car between the
       hands, scales #notice-screen-zoom on hover and fills #notice-line;
       everything it adds lives inside #notice-viewport, whose viewBox equals
       its viewport so child coordinates stay absolute while the nested <svg>
       clips them to the slate. -->
  <g class="sign-rise">
    <g id="notice-sign-car">
      <rect x="14.2" y="0" width="0.8" height="5" fill="#9C6B3C"/>
      <g id="notice-screen-zoom">
        <rect x="4.6" y="-9" width="20" height="9.6" fill="#8B5A2B" rx="0.3"/>
        <rect x="5.3" y="-8.3" width="18.6" height="8.2" fill="#2F4A3A"/>
        <rect x="6.1" y="-0.8" width="1.8" height="0.5" fill="#F2F2E6"/>
        <rect id="notice-chalk" x="8.4" y="-0.8" width="1.2" height="0.5" fill="#7FB2FF"/>
        <svg id="notice-viewport" x="5.4" y="-8.2" width="18.4" height="8" viewBox="5.4 -8.2 18.4 8" overflow="hidden">
          <g id="notice-line"/>
        </svg>
      </g>
    </g>
  </g>

  <!-- Hands on the stick, outside the sign so they stay put while it zooms. -->
  <g fill="#DE886D">
    <rect id="notice-hand-right" x="13.4" y="4" width="2.2" height="1.6"/>
    <rect id="notice-hand-left" x="-0.6" y="4" width="2.2" height="1.6" visibility="hidden"/>
  </g>
</svg>
